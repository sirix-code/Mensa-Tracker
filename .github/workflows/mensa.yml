name: mensa

on:
  schedule:
    # GitHub rechnet nur in UTC. 8:00 deutsche Zeit ist 07:00 UTC im Winter und 06:00 UTC im Sommer.
    # Deshalb laufen beide Zeiten, und der erste Schritt lässt nur den passenden durch.
    - cron: "5 6 * * *"
    - cron: "5 7 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Uhrzeit prüfen (nur 8 Uhr deutscher Zeit)
        id: time
        run: |
          hour=$(TZ=Europe/Berlin date +%H)
          echo "Uhrzeit in Deutschland: Stunde $hour"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$hour" != "08" ]; then
            echo "Nicht 8 Uhr, überspringe."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.time.outputs.go == 'true'

      - uses: actions/setup-python@v5
        if: steps.time.outputs.go == 'true'
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        if: steps.time.outputs.go == 'true'
        run: pip install requests beautifulsoup4

      - name: Mensaplan senden
        if: steps.time.outputs.go == 'true'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MENSA_WATCH: ${{ vars.MENSA_WATCH }}
        run: python mensa.py
